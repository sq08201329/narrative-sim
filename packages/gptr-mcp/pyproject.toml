[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gptr-mcp"
version = "0.1.0"
description = "GPT-Researcher MCP service integrated into narrative-sim"
requires-python = ">=3.12"
dependencies = [
    "gpt-researcher>=0.14.0",
    "python-dotenv>=1.2.4",
    "fastmcp-slim[server]>=4.1.1",
    "fastapi>=0.103.1",
    "uvicorn>=0.23.2",
    "pydantic>=2.3.0",
    "loguru>=0.7.0",
]

[tool.hatch.build.targets.wheel]
include = ["server.py", "utils.py"]
