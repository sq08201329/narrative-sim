[project]
name = "narrative-sim"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gptr-deepseek-retriever",
    "jsonschema>=4.26.0",
    "mcp>=2.3.0",
    "openai>=3.35.1",
    "python-dotenv>=1.2.4",
    "tinytroupe",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "real: 需要真实 LLM 密钥的在线验收用例",
]

[tool.uv.sources]
tinytroupe = { git = "https://github.com/microsoft/TinyTroupe.git", rev = "a6244b358a1fe1c71bf751f7ba0f8dfa368ec5a4" }
gptr-deepseek-retriever = { workspace = true, editable = true }

[tool.uv.workspace]
members = [
    "plugins/gptr-deepseek-retriever",
]
