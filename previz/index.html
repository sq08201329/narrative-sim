<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>预演器 — narrative-sim</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0f12; color: #ddd;
               font-family: "Microsoft YaHei", sans-serif; overflow: hidden; }
  #stage { position: absolute; inset: 0; }
  #hud { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px;
         background: linear-gradient(transparent, rgba(0,0,0,.85) 40%); }
  #subtitle { min-height: 52px; font-size: 17px; line-height: 1.5; }
  #subtitle .tag { display: inline-block; padding: 1px 8px; margin-right: 8px;
                   border-radius: 3px; font-size: 13px; color: #0d0f12; }
  #meta { font-size: 12px; color: #889; margin-bottom: 4px; }
  #bar { display: flex; gap: 10px; align-items: center; margin-top: 8px;
         font-size: 13px; }
  button, select { background: #1d232c; color: #ddd; border: 1px solid #345;
                   border-radius: 4px; padding: 4px 12px; cursor: pointer; }
  button:hover { background: #28313d; }
  #progress { flex: 1; accent-color: #4a90d9; }
  #title { position: absolute; top: 10px; left: 14px; font-size: 13px;
           color: #778; }
  .t-dialogue    { background: #4a90d9; }
  .t-inner_voice { background: #b85cd9; }
  .t-action      { background: #5cb85c; }
  .t-scene_change{ background: #d9b44a; }
  .t-narration   { background: #999; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="title"></div>
<div id="hud">
  <div id="meta"></div>
  <div id="subtitle"></div>
  <div id="bar">
    <button id="prev">⏮</button>
    <button id="play">▶</button>
    <button id="next">⏭</button>
    <input id="progress" type="range" min="0" value="0">
    <select id="speed">
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
      <option value="4">4×</option>
    </select>
  </div>
</div>
<script src="previz_data.js"></script>
<script type="module" src="previz.js"></script>
</body>
</html>
